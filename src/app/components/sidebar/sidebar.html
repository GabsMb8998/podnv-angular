<aside>
    <div class="container-aside">
        <div>
            <span class="fw-bold text-2xl">LOGO</span>
        </div>
    
        <div class="container-items">
           <div *ngFor="let item of itemSideBar; index as i" class="sidebar-container-items item">
                <mat-icon [svgIcon]="item.icon" [ngClass]="isSelected == item.label ? 'icon_selected' : 'icon_deselected'"></mat-icon>
                <span 
                (click)="handleSelected(item.label)" 
                 
                [ngClass]="isSelected == item.label ? 'item_selected' : 'item_deselected'">
                    {{ item.label }}
                </span>
            </div>
        </div>
        
        <div class="sidebar-container-items container-log-out">
            <mat-icon svgIcon="icon-log-out"/>
            <span class="text-lg fw-medium" >Log out</span>
        </div>
    </div>
</aside>
